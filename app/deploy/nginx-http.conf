# Antes do DNS/certificado, apenas o desafio ACME fica público.
server {
    listen 80;
    listen [::]:80;
    server_name virtuta.site www.virtuta.site lk.virtuta.site;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/virtuta-acme;
        default_type text/plain;
    }
    location / {
        default_type text/plain;
        add_header Retry-After 300 always;
        return 503 "Virtuta: aguardando ativacao do HTTPS.\n";
    }
}
