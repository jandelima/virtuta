server_tokens off;
client_max_body_size 64k;
client_body_timeout 15s;
send_timeout 30s;
limit_req_status 429;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy 'camera=(self), microphone=(self), display-capture=(self), geolocation=()' always;
add_header Strict-Transport-Security 'max-age=31536000' always;
add_header X-Robots-Tag 'noindex, nofollow' always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://i.ytimg.com; connect-src 'self' wss://lk.virtuta.site; media-src 'self' blob:; worker-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
gzip_vary on;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml model/gltf-binary;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Connection '';
location ~ /\. { return 404; }
location = /api/auth/dev { return 404; }
location /api/auth/ {
    limit_req zone=virtuta_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:8787;
}
location /api/ {
    limit_req zone=virtuta_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:8787;
}
location = /ws {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $virtuta_connection_upgrade;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
}
location / { proxy_pass http://127.0.0.1:8787; }
