server {
    listen 80;
    listen [::]:80;
    server_name virtuta.site www.virtuta.site lk.virtuta.site;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/virtuta-acme;
        default_type text/plain;
    }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.virtuta.site;
    ssl_certificate /etc/letsencrypt/live/virtuta.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtuta.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 308 https://virtuta.site$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name virtuta.site;
    ssl_certificate /etc/letsencrypt/live/virtuta.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtuta.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    access_log /var/log/nginx/virtuta.access.log virtuta;
    error_log /var/log/nginx/virtuta.error.log;
    include /etc/nginx/snippets/virtuta-app.conf;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lk.virtuta.site;
    ssl_certificate /etc/letsencrypt/live/virtuta.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/virtuta.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    server_tokens off;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    access_log off;
    error_log /var/log/nginx/virtuta-livekit.error.log;
    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $virtuta_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
