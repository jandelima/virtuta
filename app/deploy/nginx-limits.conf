map $http_upgrade $virtuta_connection_upgrade {
    default upgrade;
    '' close;
}
limit_req_zone $binary_remote_addr zone=virtuta_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=virtuta_api:10m rate=20r/s;
# Não registrar query strings: podem conter convites e códigos temporários OAuth.
log_format virtuta '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
